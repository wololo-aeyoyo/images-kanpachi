name: build

# Builds and pushes the Kanpachi sidecar consumed by the Zomboid pod in the
# cluster-kubernetes repo (zomboid/zomboid-release.yaml). The tag is NOT
# derived from the commit: that manifest pins an exact version, so the tag
# comes from the VERSION file and a release is a bump to that file. Pushing a
# tag that already exists in the registry is refused rather than silently
# overwritten, so a forgotten bump fails loudly instead of moving a tag the
# cluster has already pulled.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      overwrite:
        description: "Push even if the tag already exists (re-releases the same version)"
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/kanpachi-sidecar

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ -z "$version" ]; then
            echo "::error::VERSION is empty"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $IMAGE_NAME:$version"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A tag the cluster already runs must never change meaning underneath it.
      - name: Refuse to clobber an existing tag
        if: ${{ inputs.overwrite != true }}
        run: |
          ref="$REGISTRY/$IMAGE_NAME:${{ steps.version.outputs.version }}"
          if docker manifest inspect "$ref" > /dev/null 2>&1; then
            echo "::error::$ref already exists. Bump VERSION, or re-run with overwrite=true."
            exit 1
          fi
          echo "$ref is free."

      - uses: docker/setup-buildx-action@v3

      # The Zomboid Deployment pins nodeSelector kubernetes.io/arch: amd64,
      # so a single-arch image is all the cluster can schedule.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Pushed \`$REGISTRY/$IMAGE_NAME:${{ steps.version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
